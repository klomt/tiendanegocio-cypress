

# Este archivo define la base de datos MySQL usada por las pruebas de Cypress.
# Levanta un contenedor con MySQL 8.0 para guardar los datos necesarios durante la ejecución
# de las pruebas automatizadas del proyecto.

services:
  # Servicio de base de datos principal.
  db:
    # Imagen oficial de MySQL 8.0.
    image: mysql:8.0
    container_name: mysql_container
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: mydatabase
      MYSQL_USER: myuser
      MYSQL_PASSWORD: mypassword
    ports:
      - "2207:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "myuser", "-pmypassword"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - ./my.cnf:/etc/mysql/conf.d/my.cnf 
    networks:
      - migration-net

networks:
  migration-net:
    external: true